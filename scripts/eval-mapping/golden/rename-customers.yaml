# 改写自 rfm-seed shop_pg.customers：字段改名（nick_name → name、mobile → phone、unionid → external_id），时间列带时区、直接用
model: 1
entity: customer
table: customers
fields:
  customer_id: string(customer_id)
  name: nick_name
  phone: mobile
  email: email
  external_id: unionid
  gender:
    expr: gender
    dictionary:
      F: female
      M: male
  city: city
  registered_at: created_at
  updated_at: updated_at
