# 改写自 crm-seed loyalty_pg.coupons.coupon：字段改名（coupon_code → coupon_id、used_at → redeemed_at），状态是大写英文
model: 1
entity: coupon
table: coupons
fields:
  coupon_id: coupon_code
  coupon_template_id: template_id
  campaign_id: campaign_id
  customer_id: member_id
  status:
    expr: status
    dictionary:
      UNUSED: issued
      USED: redeemed
      EXPIRED: expired
      VOID: voided
  issued_at: issued_at
  redeemed_at: used_at
  discount_amount: discount_amount
  expires_at: expires_at
  updated_at: updated_at
