kind: metric
request: 近 30 天按支付时间算的营收（已支付、已发货、已完成的订单）
expected:
  base: order
  measure: { agg: sum, field: amount }
  filter:
    - { field: status, op: in, value: [paid, shipped, completed] }
  window: { field: paid_at, days: 30 }
failure_type: b
covers: [same-name]
retrieval:
  candidates: [metric:revenue_paid_30d]
  forbidden: [metric:revenue_30d, metric:gross_revenue_30d, metric:item_revenue_30d]
  ambiguous: false
clarify: null
