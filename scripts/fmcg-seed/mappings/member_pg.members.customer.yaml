# member_pg（Postgres）members → 消费者。会员中心（小程序会员）：手机必有，unionid 约 80%（作外部 ID）；性别 F/M/U。
# 统一消费者的属性以会员中心为准：survivorship 优先级 1，其余数据源没配优先级、按 updated_at 取最新（ADR-0027，K8）
model: 1
entity: customer
table: members
survivorship: { priority: 1 }
fields:
  customer_id: member_id
  name: nickname
  phone: mobile
  external_id: unionid
  gender:
    expr: gender
    dictionary:
      F: female
      M: male
      U: unknown
  birthday: birthday
  city: city
  registered_at: registered_at
  updated_at: updated_at
