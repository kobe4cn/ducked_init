# events_s3（S3 JSON）events → 行为事件。小程序埋点：user_id 是会员中心的会员号，跨源引用 member_pg 的消费者（ADR-0030），登录事件也给出设备主人；
# 匿名事件 user_id 为空、只有 device_id（P06 经设备归属到人）；签到 sign_in 每次 1 积分（会员中心另记一笔流水）；时间是 Unix 毫秒
model: 1
entity: event
table: events
fields:
  event_id: event_id
  customer_id: { expr: user_id, customer_source: member_pg }
  device_id: device_id
  event_type: event_name
  occurred_at: from_epoch_millis(ts_ms)
  page: page
