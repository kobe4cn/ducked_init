# jd_s3（S3 CSV）源视图 jd_lines（views/jd_s3.jd_lines.sql）→ 订单明细。京东 SKU 已在视图里换成商家编码；明细号用 订单号-京东SKU 拼出
model: 1
entity: order_item
view: jd_lines
view_key: [订单号, 京东SKU]
fields:
  order_item_id: concat(string(订单号), '-', 京东SKU)
  order_id: string(订单号)
  product_id: 商家编码
  quantity: 数量
  unit_price: round(金额 / 数量, 2)
  amount: 金额
