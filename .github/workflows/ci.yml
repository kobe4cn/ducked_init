name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # MySQL 数据源的登记与只读校验测试
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: crm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pcrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_PLATFORM_DATABASE_URL: postgres://crm:crm@localhost:5432/crm_platform_test
      # 租户隔离测试在对象存储上再跑一遍（SeaweedFS，平台账号 crm / crm-secret，租户账号由测试开通租户时经 IAM API 创建）
      TEST_S3_LAKE_URI: s3://crm-lake/platform-test
      # 用 127.0.0.1 而不是 localhost：MySQL 客户端把 localhost 当作本机 socket
      TEST_MYSQL_URL: mysql://root:crm@127.0.0.1:3306/crm_source_test
    steps:
      - uses: actions/checkout@v4
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 8333:8333 -e AWS_ACCESS_KEY_ID=crm -e AWS_SECRET_ACCESS_KEY=crm-secret \
            chrislusf/seaweedfs server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.iam.readOnly=false -master.volumeSizeLimitMB=1024
          for i in $(seq 60); do
            curl -sf -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user crm:crm-secret http://localhost:8333/crm-lake && exit 0
            sleep 2
          done
          docker logs seaweedfs; exit 1
      # 版本取自 package.json 的 packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
