name: CI

# 只改文档、agent 配置的提交不跑。app/ 下没有 .md，测试里提到 docs/ 的只是注释；没有必需的检查，跳过不会卡住 PR
on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - 'docs/**'
      - '*.md'
      - '.sandcastle/**/*.md'
      - '.claude/**'
      - '.agents/**'
      - '.cursor/**'
  pull_request:
    paths-ignore: *docs-only

# PR 分支再推送时取消旧的运行；main 的 push 用 run_id 各自成组，每个提交都跑完
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.shard }}/5)
    runs-on: ubuntu-24.04
    # 分片并行：单个 4 核 runner、2 个 worker 跑完整测试要 70 分钟以上。每片自带一套服务，片之间互不影响。
    # 片数受账号同时运行 20 个 job 的上限约束，多个运行同时排队时片太多反而更慢
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # MySQL 数据源的登记与只读校验测试
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: crm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pcrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      # MongoDB 数据源的登记与只读校验测试（开启访问控制：root 账号 crm / crm）
      mongodb:
        # 暂用 7.x：ubuntu-24.04 镜像 20261018 起内核为 7.0.0，MongoDB 8 在 6.19 ~ 7.0.13 内核上拒绝启动
        # （SERVER-121912 / SERVER-125742）。Runner 内核到 7.0.14+ 后改回 mongo:8
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: crm
          MONGO_INITDB_ROOT_PASSWORD: crm
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_PLATFORM_DATABASE_URL: postgres://crm:crm@localhost:5432/crm_platform_test
      # 本地默认 8 个 worker 要求 PG max_connections ≥ 300；这里的 postgres service 是默认的 100，runner 也只有 4 核。
      # 4 个 worker 时 runner 上还跑着 PG / MySQL / MongoDB / SeaweedFS，重夹具（合并、建服务库）跑不进 90 秒，超时后残留任务又撞上下一个用例的 resetDb
      CRM_TEST_WORKERS: 2
      # 租户隔离测试在对象存储上再跑一遍（SeaweedFS，平台账号 crm / crm-secret，租户账号由测试开通租户时经 IAM API 创建）
      TEST_S3_LAKE_URI: s3://crm-lake/platform-test
      # 用 127.0.0.1 而不是 localhost：MySQL 客户端把 localhost 当作本机 socket
      TEST_MYSQL_URL: mysql://root:crm@127.0.0.1:3306/crm_source_test
      TEST_MONGO_URL: mongodb://crm:crm@localhost:27017/crm_source_test?authSource=admin
    steps:
      - uses: actions/checkout@v4
      - name: Start SeaweedFS
        # 固定版本：latest 换成 4.50 后 DeleteUser 改按 AWS 语义拒绝还有密钥的账号，整批用例随之失败
        run: |
          docker run -d --name seaweedfs -p 8333:8333 -e AWS_ACCESS_KEY_ID=crm -e AWS_SECRET_ACCESS_KEY=crm-secret \
            chrislusf/seaweedfs:4.50 server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.iam.readOnly=false -master.volumeSizeLimitMB=1024
          # 用 Runner 自带的 AWS CLI 建桶，不依赖 curl 版本的 --aws-sigv4 实现
          for i in $(seq 60); do
            AWS_ACCESS_KEY_ID=crm AWS_SECRET_ACCESS_KEY=crm-secret AWS_DEFAULT_REGION=us-east-1 \
              aws --endpoint-url http://localhost:8333 s3api create-bucket --bucket crm-lake >/dev/null && exit 0
            sleep 2
          done
          docker logs seaweedfs; exit 1
      # 版本取自 package.json 的 packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck 与分片无关，只在第 1 片跑
      - if: matrix.shard == 1
        run: pnpm run typecheck
      - run: pnpm test --shard=${{ matrix.shard }}/5
