name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PLATFORM_DATABASE_URL: postgres://crm:crm@localhost:5432/crm_platform_test
      # 租户隔离测试在对象存储上再跑一遍（SeaweedFS，账号见 docker/seaweedfs/s3.json）
      TEST_S3_LAKE_URI: s3://crm-lake/platform-test
    steps:
      - uses: actions/checkout@v4
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 8333:8333 -v "$PWD/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
          for i in $(seq 60); do
            curl -sf -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user crm:crm-secret http://localhost:8333/crm-lake && exit 0
            sleep 2
          done
          docker logs seaweedfs; exit 1
      # 版本取自 package.json 的 packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
